<!-- Keep executable JavaScript outside x-dc so its HTML normalizer cannot rewrite identifiers. -->
<script>
  (function syncParentTheme() {
    const root = document.documentElement;
    let parentRoot;
    try { parentRoot = window.parent.document.documentElement; } catch (error) { return; }
    const sync = () => {
      if (parentRoot.getAttribute('data-theme') === 'light') root.setAttribute('data-parent-theme', 'light');
      else root.removeAttribute('data-parent-theme');
    };
    sync();
    new MutationObserver(sync).observe(parentRoot, { attributes: true, attributeFilter: ['data-theme'] });
  }());
</script>
</head>
