# The Next.js runtime (OpenNext adapter) turns the .next output into a
# deployable site: static pages, server functions and routing. It is declared
# explicitly so it always runs - without it the raw .next folder is uploaded
# as plain files and every route, including `/`, returns 404.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node >= 20.9
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# next.config.mjs sets these too; repeated here so the CDN applies them to
# files served straight from public/.

# The fold scenes are .jsx executed in the browser by public/support.js.
# Without a JavaScript type they are served as text/plain and fail to load.
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/folds/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Scene documents are iframe content, not pages: renderable, never indexed.
[[headers]]
  for = "/folds/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
