# Netlify detects Next.js and applies its Next.js runtime (OpenNext adapter)
# automatically - no plugin install needed.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node >= 20.9
  NODE_VERSION = "22"

# next.config.mjs sets these too; repeated here so the CDN applies them to
# files served straight from public/.

# The fold scenes are .jsx executed in the browser by public/support.js.
# Without a JavaScript type they are served as text/plain and fail to load.
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/folds/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
